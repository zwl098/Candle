<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>烛火</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23070605' width='32' height='32'/%3E%3Cpath fill='%23ffb15a' d='M16 4c2 4 3 6 3 8a3 3 0 1 1-6 0c0-2 1-4 3-8z'/%3E%3Crect fill='%23e6d3b0' x='14.2' y='16' width='3.6' height='12' rx='1.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
  <!-- 火焰与场景为原创实现。Three.js r170，Copyright 2010-2024 Three.js Authors，MIT。见 vendor/THREE.LICENSE -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <p class="credit">原创火焰体积着色器。Three.js r170（MIT License）</p>
    <div class="tools">
      <button type="button" id="blow" aria-pressed="false">吹气熄灭</button>
      <button type="button" id="mute" aria-pressed="false">静音</button>
    </div>
  </header>

  <div class="bottom">
    <p id="status" role="status">未燃</p>
    <p id="hint">点击烛芯，或按 Enter / 空格</p>
    <button type="button" id="action" aria-describedby="hint">点燃</button>
    <p id="note" role="status"></p>
  </div>

  <p id="fallback" hidden>需要 WebGL 才能渲染这根蜡烛。</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
